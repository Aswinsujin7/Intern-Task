<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

        <div class="dashboard">

            <div class="card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>

            <div class="card">
                <h3>Active Employees</h3>
                <p id="activeEmployees">0</p>
            </div>

            <div class="card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

        </div>

        
        <div class="section">

            <h2>EMPLOYEE LIST</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                    <!-- JavaScript employee data will come here -->
                </tbody>

            </table>

        </div>

        <div class="section">

            <h2>SEARCH EMPLOYEE</h2>

            <div class="search-box">

                <label>Employee ID:</label>

                <input
                    type="number"
                    id="employeeId"
                    placeholder="Enter Employee ID"
                >

                <button onclick="searchEmployee()">Search</button>

            </div>

        </div>

        <div class="section">

            <h2>EMPLOYEE DETAILS</h2>

            <div id="employeeDetails">
                Search an employee to see the details.
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
